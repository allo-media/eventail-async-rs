[package]
name = "eventail-async-rs"
version = "1.3.1"
edition = "2021"

[lib]
name = "eventail"

[dependencies]
async-trait = "0.1"
amqprs = { version = "1.4", features = ["urispec"] }
# amqprs = { path="/home/romuald/tmp/amqprs/amqprs", features = ["urispec"] }
log = "0.4"
serde = "1.0"
serde_json = "1.0"
cbor4ii = { version = "0.3", features = ["serde1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
gethostname = "0.4.3"


[dev-dependencies]
env_logger = "0.7"
serde = { version = "1.0", features = ["derive"] }
