[package]
name = "eventail-async-rs"
version = "1.0.0"
edition = "2021"

[lib]
name = "eventail"

[dependencies]
async-trait = "0.1"
amqprs = { version = "1.4", features = ["urispec"] }
log = "0.4"
serde = "1.0"
serde_json = "1.0"
serde_cbor = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }


[dev-dependencies]
env_logger = "0.7"
serde = { version = "1.0", features = ["derive"] }
