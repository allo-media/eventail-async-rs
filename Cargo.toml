[package]
name = "eventail-async-rs"
version = "1.6.0"
edition = "2024"
license = "MIT"
description = "Async Rust + Tokio implementation of the Eventail event-driven messaging protocol over AMQP (RabbitMQ)."
repository = "https://github.com/allo-media/eventail-async-rs"
documentation = "https://eventail-rs.netlify.app/"
readme = "README.md"

[lib]
name = "eventail"

[dependencies]
async-trait = "0.1"
amqprs = { version = "2.1", features = ["urispec"] }
log = "0.4"
serde = "1.0"
serde_json = "1.0"
cbor4ii = { version = "1.0", features = ["serde1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
gethostname = "0.4.3"


[dev-dependencies]
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
